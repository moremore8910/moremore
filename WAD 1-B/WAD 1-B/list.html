<!DOCTYPE html>
<html>
<head>
    <title>User List</title>

    <style>
        body{
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        h2{
            text-align: center;
        }

        table{
            width: 60%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 10px gray;
        }

        th, td{
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th{
            background: #007bff;
            color: white;
        }

        tr:nth-child(even){
            background: #f2f2f2;
        }
    </style>
</head>

<body>

<h2>Registered Users</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Email</th>
    </tr>

    <tbody id="data"></tbody>
</table>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];

let output = "";

users.forEach(u => {
    output += `
        <tr>
            <td>${u.name}</td>
            <td>${u.email}</td>
        </tr>
    `;
});

document.getElementById("data").innerHTML = output;
</script>

</body>
</html>
